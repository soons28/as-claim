<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>채권신고 취하서 자동 타이핑 시스템</title>
  <!-- pdf-lib & fontkit 라이브러리 CDN 호출 -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --panel-bg: #ffffff;
      --text: #0f172a;
      --text-light: #475569;
      --border: #cbd5e1;
      --success: #10b981;
      --error: #ef4444;
    }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 좌측 입력 패널 */
    .left-panel {
      width: 420px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: 4px 0 10px rgba(0,0,0,0.05);
      z-index: 10;
    }

    .panel-header {
      padding: 24px;
      border-bottom: 1px solid #f1f5f9;
      background-color: #fafbfd;
    }

    .panel-header h1 {
      margin: 0;
      font-size: 20px;
      color: #0f172a;
      font-weight: 700;
    }
    
    .panel-header p {
      margin: 6px 0 0 0;
      font-size: 13px;
      color: var(--text-light);
    }

    .panel-content {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    input[type="text"], input[type="tel"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      transition: all 0.2s;
    }

    input[type="text"]:focus, input[type="tel"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input:disabled, select:disabled {
      background-color: #f8fafc;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover {
      background: #059669;
    }

    .btn-secondary {
      background: #64748b;
      color: white;
      margin-top: 10px;
    }

    .btn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .message {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 8px;
      display: none;
      line-height: 1.5;
    }

    .message.error {
      background: #fee2e2;
      color: var(--error);
      display: block;
      border: 1px solid #fecaca;
    }

    .message.success {
      background: #ecfdf5;
      color: #065f46;
      display: block;
      border: 1px solid #a7f3d0;
    }

    #step2 {
      display: none;
      border-top: 1px dashed var(--border);
      padding-top: 20px;
      margin-top: 20px;
    }

    /* 우측 PDF 미리보기 영역 */
    .preview-panel {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #475569;
    }

    .preview-header {
      background-color: #1e293b;
      padding: 14px 24px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .preview-header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .preview-body {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      border-radius: 4px;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(30, 41, 59, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 16px;
      font-weight: bold;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- 좌측 입력 패널 -->
  <div class="left-panel">
    <div class="panel-header">
      <h1>채권신고 취하서 입력</h1>
      <p>시부인표 정보로 PDF를 즉시 생성 및 출력합니다.</p>
    </div>

    <div class="panel-content">
      <!-- 1단계: 이름 검색 -->
      <div id="step1">
        <div class="form-group">
          <label for="nameInput">채권자 성함 (또는 법인명)</label>
          <input type="text" id="nameInput" placeholder="홍길동" required>
        </div>
        <button type="button" class="btn btn-primary" id="btnLookup" onclick="lookupName()">성함으로 채권번호 조회</button>
        <div id="lookupMsg" class="message"></div>
      </div>

      <!-- 2단계: 추가 인적사항 및 제출/인쇄 -->
      <div id="step2">
        <div class="form-group">
          <label for="claimSelect">확인된 채권번호 선택</label>
          <select id="claimSelect" onchange="onClaimSelectChange()"></select>
        </div>

        <div class="form-group">
          <label for="claimNoInput">채권번호 (수정/직접입력 가능)</label>
          <input type="text" id="claimNoInput" oninput="queuePreview()" required>
        </div>

        <div class="form-group">
          <label for="unitNo">구분 (동/호수)</label>
          <input type="text" id="unitNo" placeholder="예: 101동 202호" oninput="queuePreview()" required>
        </div>

        <div class="form-group">
          <label for="phone">연락처</label>
          <input type="tel" id="phone" placeholder="예: 010-1234-5678" oninput="queuePreview()" required>
        </div>

        <div class="form-group" style="margin-top: 24px;">
          <button type="button" class="btn btn-success" id="btnSubmit" onclick="submitAndPrint()">
            🖨️ 즉시 인쇄
          </button>
        </div>
        <div id="submitMsg" class="message"></div>
      </div>
    </div>
  </div>

  <!-- 우측 미리보기 영역 -->
  <div class="preview-panel">
    <div class="preview-header">
      <h2>실시간 출력 미리보기</h2>
      <div style="font-size: 12px; color: #94a3b8;">* 변경 사항이 실시간으로 PDF 양식 위에 작성됩니다.</div>
    </div>
    <div class="preview-body">
      <div id="loadingOverlay" class="loading-overlay" style="display: none;">초기화 파일 로딩 중...</div>
      <iframe id="pdfPreview"></iframe>
    </div>
  </div>

  <script>
    let templateBytes = null;
    let fontBytes = null;
    let currentPdfBytes = null;
    let previewDebounce = null;

    // 초기화 파일 로딩
    window.onload = async function() {
      const loader = document.getElementById('loadingOverlay');
      loader.style.display = 'flex';
      
      try {
        // 1. PDF 템플릿 로딩
        const tempRes = await fetch('/api/template');
        if (!tempRes.ok) throw new Error('PDF 템플릿 로드 실패');
        templateBytes = await tempRes.arrayBuffer();

        // 2. 한글 폰트 로딩
        const fontRes = await fetch('/api/font');
        if (!fontRes.ok) throw new Error('한글 폰트 로드 실패');
        fontBytes = await fontRes.arrayBuffer();

        loader.style.display = 'none';
        updatePreview(); // 최초 빈 양식 프리뷰
      } catch (err) {
        loader.innerText = '초기 파일(PDF/폰트) 로딩에 실패했습니다. 서버 상태를 확인해 주세요.';
        console.error(err);
      }
    };

    // 1단계: 이름 검색
    async function lookupName() {
      const name = document.getElementById('nameInput').value.trim();
      const msg = document.getElementById('lookupMsg');
      const btn = document.getElementById('btnLookup');

      if (!name) {
        alert('이름을 입력해 주세요.');
        return;
      }

      msg.style.display = 'none';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/search?name=${encodeURIComponent(name)}`);
        const result = await res.json();

        btn.disabled = false;

        if (result.success) {
          const select = document.getElementById('claimSelect');
          select.innerHTML = ''; // 초기화

          // 만약 매칭이 여러 개면 "모두 합치기" 옵션을 맨 위에 추가
          if (result.matches.length > 1) {
            const allClaimNos = result.matches.map(m => m.claimNo).join(', ');
            const opt = document.createElement('option');
            opt.value = allClaimNos;
            opt.setAttribute('data-name', result.matches[0].name); // 대표 이름 사용
            opt.text = `★ 모든 채권번호 합치기 (${allClaimNos})`;
            select.appendChild(opt);
          }

          result.matches.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.claimNo;
            opt.setAttribute('data-name', m.name);
            opt.text = `${m.claimNo} [${m.name}]`;
            select.appendChild(opt);
          });

          // 2단계 활성화 및 미리보기 갱신
          document.getElementById('step2').style.display = 'block';
          
          // 첫 번째 옵션 선택 후 claimNoInput에 값 동기화
          const input = document.getElementById('claimNoInput');
          if (input && select.options.length > 0) {
            input.value = select.options[0].value;
          }

          // 이전 동호수 및 연락처 입력값 초기화
          document.getElementById('unitNo').value = '';
          document.getElementById('phone').value = '';

          updatePreview();
        } else {
          msg.innerText = result.message;
          msg.className = 'message error';
        }
      } catch (err) {
        btn.disabled = false;
        msg.innerText = '서버 통신 실패';
        msg.className = 'message error';
      }
    }

    // 변경 시 미리보기 업데이트 지연 대기
    function queuePreview() {
      clearTimeout(previewDebounce);
      previewDebounce = setTimeout(updatePreview, 300);
    }

    function onClaimSelectChange() {
      const select = document.getElementById('claimSelect');
      const input = document.getElementById('claimNoInput');
      if (select && input) {
        input.value = select.value;
      }
      queuePreview();
    }

    // PDF 렌더링 및 미리보기 업데이트 핵심 로직
    async function updatePreview() {
      if (!templateBytes || !fontBytes) return;

      try {
        const name = document.getElementById('nameInput').value.trim();
        const claimSelect = document.getElementById('claimSelect');
        const claimNoInput = document.getElementById('claimNoInput');
        const claimNo = claimNoInput ? claimNoInput.value.trim() : '';
        const selectedOpt = claimSelect && claimSelect.options[claimSelect.selectedIndex];
        const officialName = selectedOpt ? selectedOpt.getAttribute('data-name'] : name;
        const unitNo = document.getElementById('unitNo').value.trim();
        const phone = document.getElementById('phone').value.trim();

        // 1. pdf-lib 로딩 및 폰트 장착
        const pdfDoc = await PDFLib.PDFDocument.load(templateBytes);
        pdfDoc.registerFontkit(window.fontkit);
        const customFont = await pdfDoc.embedFont(fontBytes);
        const firstPage = pdfDoc.getPages()[0];

        // maxAvailableWidth를 전달받아 글씨 크기를 자동으로 줄여주는 그리기 함수
        const draw = (text, x, y, size = 12, center = false, maxAvailableWidth = null) => {
          if (!text) return;
          let currentSize = size;
          if (maxAvailableWidth) {
            const textWidth = customFont.widthOfTextAtSize(text, currentSize);
            if (textWidth > maxAvailableWidth) {
              currentSize = Math.max(8, currentSize * (maxAvailableWidth / textWidth));
            }
          }
          let drawX = x;
          if (center) {
            const textWidth = customFont.widthOfTextAtSize(text, currentSize);
            drawX = x - (textWidth / 2);
          }
          firstPage.drawText(text, {
            x: drawX,
            y: y,
            size: currentSize,
            font: customFont,
            color: PDFLib.rgb(0, 0, 0)
          });
        };

        // 2. 값 오버레이 (정밀 조정된 중앙 정렬 좌표 및 최대 가로 제한 300pt 자동 축소 적용)
        const nameX = 376, nameY = 552;
        const unitX = 376, unitY = 505;
        const claimX = 376, claimY = 458;
        const phoneX = 376, phoneY = 411;
        const monthX = 300, monthY = 248;
        const dayX = 340, dayY = 248;
        const sigX = 297, sigY = 213;

        draw(officialName, nameX, nameY, 16, true, 300);
        
        const fullUnit = unitNo ? `안산유통상가 ${unitNo}` : '';
        draw(fullUnit, unitX, unitY, 16, true, 300);
        
        draw(claimNo, claimX, claimY, 16, true, 300);
        draw(phone, phoneX, phoneY, 16, true, 300);

        // 현재 날짜 기입
        const today = new Date();
        draw(String(today.getMonth() + 1), monthX, monthY, 13, true); // 월 (기존 16 -> 13)
        draw(String(today.getDate()), dayX, dayY, 13, true);    // 일 (기존 16 -> 13)

        // 하단 위 채권자 명단 기입 (글자 크기 동적 조절)
        let sigFontSize = 16;
        if (officialName) {
          const textWidth = customFont.widthOfTextAtSize(officialName, sigFontSize);
          const maxSigWidth = 160; // 서명란의 최대 허용 가로 너비 (sigX 297 기준 160pt가 안전)
          if (textWidth > maxSigWidth) {
            sigFontSize = Math.max(11, sigFontSize * (maxSigWidth / textWidth)); // 최소 크기도 11로 올려 가독성 확보
          }
        }
        draw(officialName, sigX, sigY, sigFontSize, true);

        // 3. iframe 데이터 전달용 변환
        currentPdfBytes = await pdfDoc.save();
        const pdfBlob = new Blob([currentPdfBytes], { type: 'application/pdf' });
        const pdfUrl = URL.createObjectURL(pdfBlob);
        // #toolbar=0&navpanes=0&scrollbar=0&zoom=65 옵션으로 PDF를 크게 꽉 채워서 표시
        document.getElementById('pdfPreview').src = pdfUrl + '#toolbar=0&navpanes=0&scrollbar=0&zoom=65';
      } catch (err) {
        console.error('PDF 미리보기 에러:', err);
      }
    }

    // 최종 접수 및 바로 인쇄
    async function submitAndPrint() {
      const nameInputVal = document.getElementById('nameInput').value.trim();
      const claimSelect = document.getElementById('claimSelect');
      const selectedOpt = claimSelect && claimSelect.options[claimSelect.selectedIndex];
      const officialName = selectedOpt ? selectedOpt.getAttribute('data-name') : nameInputVal;
      const claimNoInput = document.getElementById('claimNoInput');
      const claimNo = claimNoInput ? claimNoInput.value.trim() : '';
      const unitNo = document.getElementById('unitNo').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const msg = document.getElementById('submitMsg');
      const btn = document.getElementById('btnSubmit');

      if (!unitNo || !phone) {
        alert('동호수와 연락처를 입력해 주세요.');
        return;
      }

      msg.style.display = 'none';
      btn.disabled = true;

      // PDF 바이너리를 Base64로 인코딩
      const base64Pdf = btoa(
        new Uint8Array(currentPdfBytes)
          .reduce((data, byte) => data + String.fromCharCode(byte), '')
      );

      const submitData = {
        name: officialName,
        unitNo,
        claimNo,
        phone,
        pdfBytes: base64Pdf
      };

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(submitData)
        });
        const result = await res.json();
        
        btn.disabled = false;

        if (result.success) {
          msg.innerHTML = '<strong>성공적으로 접수 및 저장되었습니다!</strong><br>잠시 후 인쇄 창이 열립니다.';
          msg.className = 'message success';
          
          // 새 창(탭)에 PDF를 열고 onload 시점에 인쇄 창 자동 실행
          const pdfBlob = new Blob([currentPdfBytes], { type: 'application/pdf' });
          const pdfUrl = URL.createObjectURL(pdfBlob);
          const printWin = window.open(pdfUrl, '_blank');
          if (printWin) {
            printWin.onload = function() {
              setTimeout(function() {
                printWin.focus();
                printWin.print();
              }, 500);
            };
          }
        } else {
          msg.innerText = '저장 오류: ' + result.message;
          msg.className = 'message error';
        }
      } catch (err) {
        btn.disabled = false;
        msg.innerText = '서버 전송 중 통신 실패';
        msg.className = 'message error';
      }
    }

    // 폼 리셋
    function resetForm() {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
      document.getElementById('lookupMsg').style.display = 'none';
      document.getElementById('submitMsg').style.display = 'none';
      document.getElementById('unitNo').value = '';
      document.getElementById('phone').value = '';
      const claimNoInput = document.getElementById('claimNoInput');
      if (claimNoInput) claimNoInput.value = '';
      updatePreview();
    }
  </script>
</body>
</html>
